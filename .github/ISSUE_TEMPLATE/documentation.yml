name: Documentation improvement
description: Report unclear, missing, or incorrect documentation.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: Documentation location
      description: File, section, or URL.
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is unclear or incorrect?
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: Suggested improvement
      description: Include a proposed command or wording if useful.
  - type: textarea
    id: context
    attributes:
      label: Reader context
      description: OS, installation path, goal, and any sanitized error output.
