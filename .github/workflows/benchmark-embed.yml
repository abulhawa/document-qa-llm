name: Benchmark 4 - Embed

on:
  workflow_dispatch:
    inputs:
      benchmark_id:
        description: Frozen benchmark identifier
        required: true
        default: composite-v1
        type: string
      chunks_artifact_fingerprint:
        description: Exact persisted Benchmark 3 chunks artifact fingerprint
        required: true
        default: 6a74a3676d91669a55284269ade30866f8c9cc8bc27691f8251522856efad2a6
        type: string
      embedding_model:
        description: Embedding model identifier
        required: true
        default: intfloat/multilingual-e5-base
        type: string
      model_revision:
        description: Immutable Hugging Face model revision
        required: true
        default: d13f1b27baf31030b7fd040960d60d909913633f
        type: string
      batch_size:
        description: SentenceTransformer batch size per runner
        required: true
        default: "16"
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: benchmark-embed-${{ inputs.benchmark_id }}
  cancel-in-progress: false

jobs:
  prepare-model:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate benchmark module imports
        run: |
          python -c "from scripts.embed_benchmark_chunks import MODEL_IGNORE_PATTERNS; from embedder_api_multilingual.input_format import prepare_embedding_texts; print('Benchmark imports OK')"

      - name: Install Hugging Face client
        run: python -m pip install "huggingface-hub==1.33.*"

      - name: Restore immutable model cache
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface/hub
          key: benchmark-model-${{ runner.os }}-${{ inputs.embedding_model }}-${{ inputs.model_revision }}

      - name: Mint short-lived Hugging Face read token
        shell: bash
        env:
          HF_OIDC_RESOURCE: abulhawa
        run: |
          TOKEN="$(hf auth token)"
          [[ -n "$TOKEN" ]] || { echo "::error::Empty Hugging Face OIDC read token."; exit 1; }
          echo "::add-mask::$TOKEN"
          echo "HF_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Prefetch exact embedding model revision
        id: model-snapshot
        shell: bash
        run: |
          python - "${{ inputs.embedding_model }}" "${{ inputs.model_revision }}" <<'PY'
          import os
          import sys
          from huggingface_hub import snapshot_download
          from scripts.embed_benchmark_chunks import MODEL_IGNORE_PATTERNS

          repo_id = sys.argv[1]
          revision = sys.argv[2]
          path = snapshot_download(
              repo_id=repo_id,
              revision=revision,
              token=os.environ["HF_TOKEN"],
              ignore_patterns=MODEL_IGNORE_PATTERNS,
          )
          print(f"Prepared model snapshot: {path}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"path={path}\n")
          PY

      - name: Install embedding runtime for offline preflight
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0
          python -m pip install -r requirements/embed.txt

      - name: Validate cached model offline
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          python - "${{ steps.model-snapshot.outputs.path }}" <<'PY'
          import sys
          from sentence_transformers import SentenceTransformer

          path = sys.argv[1]
          model = SentenceTransformer(path, device="cpu", local_files_only=True)
          vectors = model.encode(
              ["query: benchmark preflight"],
              normalize_embeddings=True,
              convert_to_numpy=True,
          )
          if vectors.shape[0] != 1 or vectors.shape[1] <= 0:
              raise SystemExit(f"unexpected preflight shape: {vectors.shape}")
          print(f"Offline model preflight passed: shape={vectors.shape}")
          PY

      - name: Save immutable model cache
        if: steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/huggingface/hub
          key: benchmark-model-${{ runner.os }}-${{ inputs.embedding_model }}-${{ inputs.model_revision }}

  embed:
    needs: prepare-model
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard_index: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/embed.txt

      - name: Restore immutable model cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface/hub
          key: benchmark-model-${{ runner.os }}-${{ inputs.embedding_model }}-${{ inputs.model_revision }}
          fail-on-cache-miss: true

      - name: Install CPU embedding dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0
          python -m pip install -r requirements/embed.txt

      - name: Restore exact chunk artifact
        id: parent
        shell: bash
        env:
          HF_OIDC_RESOURCE: buckets/abulhawa/document-qa-artifacts
        run: |
          BUCKET_TOKEN="$(hf auth token)"
          [[ -n "$BUCKET_TOKEN" ]] || { echo "::error::Empty Hugging Face bucket token."; exit 1; }
          echo "::add-mask::$BUCKET_TOKEN"
          FINGERPRINT="${{ inputs.chunks_artifact_fingerprint }}"
          REMOTE="hf://buckets/abulhawa/document-qa-artifacts/${{ inputs.benchmark_id }}/chunks/$FINGERPRINT"
          LOCAL=".benchmark/chunks/${{ inputs.benchmark_id }}"
          HF_TOKEN="$BUCKET_TOKEN" hf buckets sync "$REMOTE" "$LOCAL"
          python - "$LOCAL/manifest.json" "$FINGERPRINT" "${{ inputs.benchmark_id }}" "$REMOTE" <<'PY'
          import json, sys
          from pathlib import Path
          m=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if m.get("artifact_fingerprint") != sys.argv[2] or m.get("artifact_type") != "chunks":
              raise SystemExit("chunks identity mismatch")
          if m.get("benchmark_id") != sys.argv[3]:
              raise SystemExit("chunks benchmark_id mismatch")
          p=m.get("persistence", {})
          if not p.get("persisted") or p.get("artifact_uri") != sys.argv[4]:
              raise SystemExit("chunks persistence metadata mismatch")
          PY
          echo "artifact_fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"

      - name: Compute embedding identity
        id: identity
        shell: bash
        run: |
          python -m scripts.embed_benchmark_chunks             --chunks-root ".benchmark/chunks/${{ inputs.benchmark_id }}"             --output-root .benchmark/embeddings             --benchmark-id "${{ inputs.benchmark_id }}"             --parent-chunks-fingerprint "${{ steps.parent.outputs.artifact_fingerprint }}"             --model-name "${{ inputs.embedding_model }}"             --model-revision "${{ inputs.model_revision }}"             --input-format e5             --execution-device cpu             --batch-size "${{ inputs.batch_size }}"             --shard-index "${{ matrix.shard_index }}"             --shard-count "8"             --fingerprint-only
          python - ".benchmark/embeddings/${{ inputs.benchmark_id }}/build.json" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          from pathlib import Path
          m=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          with Path(sys.argv[2]).open("a", encoding="utf-8") as out:
              out.write(f"artifact_fingerprint={m['artifact_fingerprint']}\n")
          PY

      - name: Embed and persist shard
        shell: bash
        env:
          HF_OIDC_RESOURCE: buckets/abulhawa/document-qa-artifacts
        run: |
          BUCKET_TOKEN="$(hf auth token)"
          [[ -n "$BUCKET_TOKEN" ]] || { echo "::error::Empty Hugging Face bucket token."; exit 1; }
          echo "::add-mask::$BUCKET_TOKEN"
          ROOT=".benchmark/embeddings/${{ inputs.benchmark_id }}"
          SHARD="$(printf '%03d' "${{ matrix.shard_index }}")"
          FINGERPRINT="${{ steps.identity.outputs.artifact_fingerprint }}"
          REMOTE_ROOT="hf://buckets/abulhawa/document-qa-artifacts/${{ inputs.benchmark_id }}/embeddings/$FINGERPRINT"
          REMOTE_MANIFEST="$RUNNER_TEMP/remote-shard.json"

          if HF_TOKEN="$BUCKET_TOKEN" hf buckets cp "$REMOTE_ROOT/shards/$SHARD/manifest.json" "$REMOTE_MANIFEST" >/dev/null 2>&1; then
            python - "$REMOTE_MANIFEST" "$FINGERPRINT" "${{ matrix.shard_index }}" "8" <<'PY'
          import json, sys
          from pathlib import Path
          m=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if m.get("artifact_fingerprint") != sys.argv[2]:
              raise SystemExit("remote shard fingerprint mismatch")
          if int(m.get("shard_index", -1)) != int(sys.argv[3]) or int(m.get("shard_count", -1)) != int(sys.argv[4]):
              raise SystemExit("remote shard layout mismatch")
          PY
            cp "$REMOTE_MANIFEST" "$RUNNER_TEMP/shard-marker.json"
          else
            HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 python -m scripts.embed_benchmark_chunks               --chunks-root ".benchmark/chunks/${{ inputs.benchmark_id }}"               --output-root .benchmark/embeddings               --benchmark-id "${{ inputs.benchmark_id }}"               --parent-chunks-fingerprint "${{ steps.parent.outputs.artifact_fingerprint }}"               --model-name "${{ inputs.embedding_model }}"               --model-revision "${{ inputs.model_revision }}"               --input-format e5               --execution-device cpu               --batch-size "${{ inputs.batch_size }}"               --shard-index "${{ matrix.shard_index }}"               --shard-count "8"

            HF_TOKEN="$BUCKET_TOKEN" hf buckets sync "$ROOT/shards/$SHARD" "$REMOTE_ROOT/shards/$SHARD" --exclude "manifest.json"
            if [[ "${{ matrix.shard_index }}" == "0" && -d "$ROOT/queries" ]]; then
              HF_TOKEN="$BUCKET_TOKEN" hf buckets sync "$ROOT/queries" "$REMOTE_ROOT/queries"
            fi
            HF_TOKEN="$BUCKET_TOKEN" hf buckets cp "$ROOT/shards/$SHARD/manifest.json" "$REMOTE_ROOT/shards/$SHARD/manifest.json"
            cp "$ROOT/shards/$SHARD/manifest.json" "$RUNNER_TEMP/shard-marker.json"
          fi

          HF_TOKEN="$BUCKET_TOKEN" hf buckets cp "$RUNNER_TEMP/shard-marker.json"             "hf://buckets/abulhawa/document-qa-artifacts/${{ inputs.benchmark_id }}/embeddings/runs/${{ github.run_id }}/shard-${{ matrix.shard_index }}.json"

  finalize:
    needs: embed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Hugging Face CLI
        run: python -m pip install "huggingface-hub==1.33.*"

      - name: Finalize immutable embedding artifact
        id: final
        shell: bash
        env:
          HF_OIDC_RESOURCE: buckets/abulhawa/document-qa-artifacts
        run: |
          BUCKET_TOKEN="$(hf auth token)"
          [[ -n "$BUCKET_TOKEN" ]] || { echo "::error::Empty Hugging Face bucket token."; exit 1; }
          echo "::add-mask::$BUCKET_TOKEN"
          MARKERS="$RUNNER_TEMP/embedding-markers"
          mkdir -p "$MARKERS"
          HF_TOKEN="$BUCKET_TOKEN" hf buckets sync             "hf://buckets/abulhawa/document-qa-artifacts/${{ inputs.benchmark_id }}/embeddings/runs/${{ github.run_id }}"             "$MARKERS"

          FINGERPRINT="$(python - "$MARKERS" "8" <<'PY'
          import json, sys
          from pathlib import Path
          paths=sorted(Path(sys.argv[1]).glob("shard-*.json"))
          if len(paths) != int(sys.argv[2]):
              raise SystemExit("incomplete embedding shard markers")
          values={json.loads(p.read_text(encoding="utf-8"))["artifact_fingerprint"] for p in paths}
          if len(values) != 1:
              raise SystemExit("embedding shard fingerprints disagree")
          print(values.pop())
          PY
          )"
          REMOTE_ROOT="hf://buckets/abulhawa/document-qa-artifacts/${{ inputs.benchmark_id }}/embeddings/$FINGERPRINT"
          MANIFEST="$RUNNER_TEMP/embedding-manifest.json"

          if HF_TOKEN="$BUCKET_TOKEN" hf buckets cp "$REMOTE_ROOT/manifest.json" "$MANIFEST" >/dev/null 2>&1; then
            REUSED=true
          else
            python scripts/finalize_benchmark_embeddings.py               --markers-dir "$MARKERS"               --output "$MANIFEST"               --benchmark-id "${{ inputs.benchmark_id }}"               --parent-chunks-fingerprint "${{ inputs.chunks_artifact_fingerprint }}"               --artifact-uri "$REMOTE_ROOT"               --expected-shards "8"
            HF_TOKEN="$BUCKET_TOKEN" hf buckets cp "$MANIFEST" "$REMOTE_ROOT/manifest.json"
            REUSED=false
          fi

          POINTER="$RUNNER_TEMP/embeddings-current.json"
          python - "$MANIFEST" "$POINTER" <<'PY'
          import json, sys
          from pathlib import Path
          m=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          p={
              "schema_version": 1,
              "benchmark_id": m["benchmark_id"],
              "artifact_type": "embeddings",
              "artifact_fingerprint": m["artifact_fingerprint"],
              "artifact_uri": m["persistence"]["artifact_uri"],
              "parent_chunks_artifact_fingerprint": m["parent_chunks_artifact_fingerprint"],
              "model": m["model"],
              "vector_dimension": m["vector_dimension"],
          }
          Path(sys.argv[2]).write_text(json.dumps(p, indent=2, sort_keys=True)+"\n", encoding="utf-8")
          PY
          HF_TOKEN="$BUCKET_TOKEN" hf buckets cp "$POINTER"             "hf://buckets/abulhawa/document-qa-artifacts/${{ inputs.benchmark_id }}/embeddings/current.json"

          python - "$MANIFEST" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          from pathlib import Path
          m=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          with Path(sys.argv[2]).open("a", encoding="utf-8") as out:
              out.write(f"artifact_fingerprint={m['artifact_fingerprint']}\n")
              out.write(f"chunk_embeddings={m['chunk_embeddings']}\n")
              out.write(f"query_embeddings={m['query_embeddings']}\n")
              out.write(f"vector_dimension={m['vector_dimension']}\n")
          PY
          echo "artifact_uri=$REMOTE_ROOT" >> "$GITHUB_OUTPUT"
          echo "reused_existing=$REUSED" >> "$GITHUB_OUTPUT"

      - name: Upload embedding manifest
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.benchmark_id }}-embedding-manifest-${{ steps.final.outputs.artifact_fingerprint }}
          path: ${{ runner.temp }}/embedding-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Write job summary
        shell: bash
        run: |
          {
            echo "## Benchmark embeddings"
            echo "- Parent chunks: ${{ inputs.chunks_artifact_fingerprint }}"
            echo "- Embedding artifact: ${{ steps.final.outputs.artifact_fingerprint }}"
            echo "- Model: ${{ inputs.embedding_model }}@${{ inputs.model_revision }}"
            echo "- Input contract: E5 passage/query roles"
            echo "- Chunk embeddings: ${{ steps.final.outputs.chunk_embeddings }}"
            echo "- Query embeddings: ${{ steps.final.outputs.query_embeddings }}"
            echo "- Dimension: ${{ steps.final.outputs.vector_dimension }}"
            echo "- Artifact URI: ${{ steps.final.outputs.artifact_uri }}"
            echo "- Reused existing artifact: ${{ steps.final.outputs.reused_existing }}"
          } >> "$GITHUB_STEP_SUMMARY"
