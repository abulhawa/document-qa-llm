name: Benchmark 6 - Evaluate

on:
  workflow_dispatch:
    inputs:
      benchmark_id:
        description: Frozen benchmark identifier
        required: true
        default: composite-v1
        type: string
      index_artifact_fingerprint:
        description: Exact Benchmark 5 combined index fingerprint, or current
        required: true
        default: current
        type: string
      tier:
        description: Evaluation tier
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - medium
          - full
      baseline:
        description: Optional prior evaluation fingerprint, or current
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: benchmark-eval-${{ inputs.benchmark_id }}-${{ inputs.tier }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  OPENSEARCH_VERSION: "3.8.0"
  QDRANT_VERSION: "1.19.1"
  OPENSEARCH_URL: http://localhost:9200
  QDRANT_URL: http://localhost:6333
  CHUNKS_INDEX_BASE: benchmark-documents
  QDRANT_COLLECTION_BASE: benchmark-document-chunks
  NAMESPACE: ""
  INDEX_PREFIX: ""
  INDEX_SUFFIX: ""

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/benchmark-eval.txt

      - name: Install evaluation runtime
        run: python -m pip install -r requirements/benchmark-eval.txt

      - name: Mint short-lived Hugging Face bucket token
        env:
          HF_OIDC_RESOURCE: buckets/abulhawa/document-qa-artifacts
        run: |
          TOKEN="$(hf auth token)"
          [[ -n "$TOKEN" ]] || { echo "::error::Empty Hugging Face bucket token."; exit 1; }
          echo "::add-mask::$TOKEN"
          echo "HF_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Resolve Benchmark 5 lineage and restore evaluation inputs
        run: |
          python -m scripts.benchmark_eval_artifacts prepare             --benchmark-id "${{ inputs.benchmark_id }}"             --index-artifact-fingerprint "${{ inputs.index_artifact_fingerprint }}"             --tier "${{ inputs.tier }}"             --baseline "${{ inputs.baseline }}"             --workdir "$RUNNER_TEMP/benchmark-eval"             --opensearch-version "$OPENSEARCH_VERSION"             --qdrant-version "$QDRANT_VERSION"             --opensearch-index "$CHUNKS_INDEX_BASE"             --qdrant-collection "$QDRANT_COLLECTION_BASE"             --github-env "$GITHUB_ENV"

      - name: Start pinned retrieval backends
        run: |
          REPO_DIR="$RUNNER_TEMP/opensearch-snapshots"
          mkdir -p "$REPO_DIR"
          chmod 0777 "$REPO_DIR"
          docker run -d --name benchmark-opensearch             --ulimit memlock=-1:-1             -p 9200:9200             -e discovery.type=single-node             -e DISABLE_INSTALL_DEMO_CONFIG=true             -e DISABLE_SECURITY_PLUGIN=true             -e OPENSEARCH_JAVA_OPTS="-Xms1g -Xmx1g"             -e path.repo=/mnt/opensearch-backups             -v "$REPO_DIR:/mnt/opensearch-backups"             "opensearchproject/opensearch:$OPENSEARCH_VERSION"
          docker run -d --name benchmark-qdrant             -p 6333:6333             "qdrant/qdrant:v$QDRANT_VERSION"

      - name: Restore and verify OpenSearch snapshot
        run: |
          python -m scripts.restore_benchmark_indexes opensearch             --manifest "$BENCH_WORKDIR/native/opensearch/manifest.json"             --snapshot "$BENCH_WORKDIR/native/opensearch/snapshot.tar.gz"             --benchmark-id "${{ inputs.benchmark_id }}"             --engine-fingerprint "$BENCH_OPENSEARCH_FP"             --backend-version "$OPENSEARCH_VERSION"             --url "$OPENSEARCH_URL"             --repo-dir "$RUNNER_TEMP/opensearch-snapshots"

      - name: Restore and verify Qdrant snapshot
        run: |
          python -m scripts.restore_benchmark_indexes qdrant             --manifest "$BENCH_WORKDIR/native/qdrant/manifest.json"             --snapshot "$BENCH_WORKDIR/native/qdrant/snapshot.snapshot"             --benchmark-id "${{ inputs.benchmark_id }}"             --engine-fingerprint "$BENCH_QDRANT_FP"             --backend-version "$QDRANT_VERSION"             --url "$QDRANT_URL"

      - name: Run retrieval evaluation
        run: |
          BASELINE_ARGS=()
          if [[ -n "$BENCH_BASELINE_PATH" ]]; then
            BASELINE_ARGS=(--baseline-summary "$BENCH_BASELINE_PATH")
          fi
          python -m scripts.run_benchmark_evaluation             --benchmark-id "${{ inputs.benchmark_id }}"             --tier "${{ inputs.tier }}"             --chunks-root "$BENCH_WORKDIR/chunks"             --embeddings-root "$BENCH_WORKDIR/embeddings"             --index-manifest "$BENCH_WORKDIR/index-manifest.json"             --chunks-fingerprint "$BENCH_CHUNKS_FP"             --embeddings-fingerprint "$BENCH_EMBEDDINGS_FP"             --index-fingerprint "$BENCH_INDEX_FP"             --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"             --output-dir "$BENCH_WORKDIR/evaluation"             --remote-base "hf://buckets/abulhawa/document-qa-artifacts/${{ inputs.benchmark_id }}/evaluations"             "${BASELINE_ARGS[@]}"

      - name: Persist private evaluation result
        run: |
          python -m scripts.benchmark_eval_artifacts persist             --output-dir "$BENCH_WORKDIR/evaluation"

      - name: Write evaluation summary and validate
        run: |
          python -m scripts.benchmark_eval_artifacts summary             --summary-json "$BENCH_WORKDIR/evaluation/summary.json"             --output "$GITHUB_STEP_SUMMARY"             --fail-on-errors

      - name: Backend diagnostics
        if: failure()
        run: |
          docker logs benchmark-opensearch --tail 200 || true
          docker logs benchmark-qdrant --tail 200 || true

      - name: Stop retrieval backends
        if: always()
        run: |
          docker rm -f benchmark-opensearch >/dev/null 2>&1 || true
          docker rm -f benchmark-qdrant >/dev/null 2>&1 || true
