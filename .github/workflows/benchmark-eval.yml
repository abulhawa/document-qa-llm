# Skeleton only. This workflow does not run the benchmark yet.
name: Benchmark 6 - Evaluate

on:
  workflow_dispatch:
    inputs:
      index_artifact:
        description: Upstream native-index artifact ID or digest
        required: true
        default: benchmark-index:mixed-v1
        type: string
      tier:
        description: Evaluation tier
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - medium
          - full
      baseline:
        description: Optional baseline result/artifact identifier
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  OPENSEARCH_IMAGE: opensearchproject/opensearch:3.8.0
  QDRANT_IMAGE: qdrant/qdrant:v1.19.1

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Evaluation stage skeleton
        run: |
          echo "Skeleton only: restore native indexes and run retrieval evaluation."
          echo "Planned metrics: Hit/Recall@1/3/5, MRR, nDCG@5, latency."
          echo "Planned reporting: per-source benchmark breakdown plus optional composite."
          echo "No services are started and no benchmark queries are executed by this skeleton."
