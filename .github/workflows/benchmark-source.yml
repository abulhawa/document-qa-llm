name: Benchmark 1 - Source Corpus

on:
  workflow_dispatch:
    inputs:
      benchmark_id:
        description: Versioned mixed benchmark identifier
        required: true
        default: composite-v1
        type: string
      composition_file:
        description: Versioned benchmark composition specification
        required: true
        default: evaluation/benchmarks/composite_v1.yaml
        type: string
      lock_file:
        description: Pending or frozen source lock
        required: true
        default: evaluation/benchmarks/composite_v1.lock.json
        type: string

permissions:
  contents: read

concurrency:
  group: benchmark-source-${{ inputs.benchmark_id }}
  cancel-in-progress: false

jobs:
  build-source:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HOME: ${{ github.workspace }}/.benchmark/cache/huggingface

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements/eval.txt

      - name: Verify Hugging Face token is configured
        shell: bash
        run: |
          if [[ -z "${HF_TOKEN}" ]]; then
            echo "::error::Repository secret HF_TOKEN is required for gated OfficeQA access."
            exit 1
          fi

      - name: Install source-build dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements/eval.txt

      - name: Restore reconstructible download caches
        uses: actions/cache/restore@v4
        with:
          path: |
            .benchmark/cache/huggingface
            .benchmark/cache/source
          key: benchmark-downloads-${{ runner.os }}-${{ hashFiles(inputs.composition_file) }}
          restore-keys: |
            benchmark-downloads-${{ runner.os }}-

      - name: Build deterministic source corpus
        env:
          PYTHONPATH: .
        run: |
          python scripts/build_benchmark_source.py             --spec "${{ inputs.composition_file }}"             --lock "${{ inputs.lock_file }}"             --output-root .benchmark/source             --cache-dir .benchmark/cache/source

      - name: Compute immutable source cache key
        id: source-key
        shell: bash
        run: |
          LOCK=".benchmark/source/${{ inputs.benchmark_id }}/source.lock.json"
          LOCK_SHA="$(sha256sum "$LOCK" | awk '{print $1}')"
          echo "lock_sha=$LOCK_SHA" >> "$GITHUB_OUTPUT"
          echo "cache_key=benchmark-source-${LOCK_SHA}" >> "$GITHUB_OUTPUT"

      - name: Save raw source corpus cache
        uses: actions/cache/save@v4
        with:
          path: .benchmark/source/${{ inputs.benchmark_id }}
          key: ${{ steps.source-key.outputs.cache_key }}

      - name: Save download caches
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            .benchmark/cache/huggingface
            .benchmark/cache/source
          key: benchmark-downloads-${{ runner.os }}-${{ steps.source-key.outputs.lock_sha }}

      - name: Upload lock and manifest for review
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.benchmark_id }}-source-lock-${{ steps.source-key.outputs.lock_sha }}
          path: |
            .benchmark/source/${{ inputs.benchmark_id }}/source.lock.json
            .benchmark/source/${{ inputs.benchmark_id }}/manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Write job summary
        shell: bash
        run: |
          {
            echo "## Benchmark source build"
            echo
            echo "- Benchmark: \`${{ inputs.benchmark_id }}\`"
            echo "- Source cache key: \`${{ steps.source-key.outputs.cache_key }}\`"
            echo "- Lock SHA256: \`${{ steps.source-key.outputs.lock_sha }}\`"
            echo
            echo "Review the uploaded lock/manifest artifact before replacing the pending committed lock."
          } >> "$GITHUB_STEP_SUMMARY"
