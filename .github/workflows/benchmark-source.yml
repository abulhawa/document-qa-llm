# Skeleton only. This workflow does not download or publish benchmark data yet.
name: Benchmark 1 - Source Corpus

on:
  workflow_dispatch:
    inputs:
      benchmark_id:
        description: Versioned mixed benchmark identifier
        required: true
        default: mixed-v1
        type: string
      subset:
        description: Planned corpus size
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - medium
          - full

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Source stage skeleton
        run: |
          echo "Skeleton only: build deterministic mixed benchmark source corpus."
          echo "Planned sources: Open RAGBench, OfficeQA, selected BEIR material."
          echo "Planned output: versioned source artifact + provenance manifest."
          echo "No corpus is downloaded or published by this skeleton."
