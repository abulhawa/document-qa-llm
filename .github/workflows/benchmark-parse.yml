name: Benchmark 2 - Parse

on:
  workflow_dispatch:
    inputs:
      benchmark_id:
        description: Frozen benchmark identifier
        required: true
        default: composite-v1
        type: string
      composition_file:
        description: Benchmark composition specification
        required: true
        default: evaluation/benchmarks/composite_v1.yaml
        type: string
      lock_file:
        description: Frozen source lock
        required: true
        default: evaluation/benchmarks/composite_v1.lock.json.gz
        type: string
      workers:
        description: Parallel parser workers
        required: true
        default: "4"
        type: string
      max_failures:
        description: Allowed parse failures before failing the workflow
        required: true
        default: "0"
        type: string
      pypdf_xform_limit:
        description: Trusted-benchmark Form XObject invocation cap per extraction
        required: true
        default: "50000"
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: benchmark-parse-${{ inputs.benchmark_id }}
  cancel-in-progress: false

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install parse dependencies
        run: python -m pip install -r requirements/parse.txt

      - name: Restore frozen source artifact from private Hugging Face bucket
        id: source
        shell: bash
        env:
          HF_OIDC_RESOURCE: buckets/abulhawa/document-qa-artifacts
        run: |
          BUCKET_TOKEN="$(hf auth token)"
          if [[ -z "$BUCKET_TOKEN" ]]; then
            echo "::error::Hugging Face bucket OIDC exchange returned an empty token."
            exit 1
          fi
          echo "::add-mask::$BUCKET_TOKEN"

          POINTER="$RUNNER_TEMP/source-current.json"
          HF_TOKEN="$BUCKET_TOKEN" hf buckets cp \
            "hf://buckets/abulhawa/document-qa-artifacts/${{ inputs.benchmark_id }}/source/current.json" \
            "$POINTER"

          SOURCE_META="$RUNNER_TEMP/source-meta.env"
          python - \
            "$POINTER" \
            "${{ inputs.lock_file }}" \
            "${{ inputs.composition_file }}" \
            "$SOURCE_META" <<'PY'
          import gzip
          import hashlib
          import json
          import sys
          from pathlib import Path

          pointer_path, lock_path, spec_path, output_path = map(Path, sys.argv[1:])
          pointer = json.loads(pointer_path.read_text(encoding="utf-8"))

          if lock_path.suffix == ".gz":
              with gzip.open(lock_path, "rt", encoding="utf-8") as fh:
                  lock = json.load(fh)
          else:
              lock = json.loads(lock_path.read_text(encoding="utf-8"))

          canonical_lock = (
              json.dumps(lock, indent=2, ensure_ascii=False, sort_keys=True) + "\n"
          ).encode("utf-8")
          expected_lock_sha = hashlib.sha256(canonical_lock).hexdigest()
          expected_spec_sha = hashlib.sha256(spec_path.read_bytes()).hexdigest()

          benchmark_id = "${{ inputs.benchmark_id }}"
          if pointer.get("benchmark_id") != benchmark_id:
              raise SystemExit("source pointer benchmark_id mismatch")
          fingerprint = pointer.get("artifact_fingerprint")
          expected_uri = (
              "hf://buckets/abulhawa/document-qa-artifacts/"
              f"{benchmark_id}/source/{fingerprint}"
          )
          if pointer.get("artifact_uri") != expected_uri:
              raise SystemExit("source pointer artifact URI/fingerprint mismatch")
          if pointer.get("lock_sha256") != expected_lock_sha:
              raise SystemExit("source pointer does not match the frozen source lock")
          if pointer.get("spec_sha256") != expected_spec_sha:
              raise SystemExit("source pointer does not match the benchmark composition")

          with output_path.open("w", encoding="utf-8") as out:
              out.write(f"ARTIFACT_FINGERPRINT={pointer['artifact_fingerprint']}\n")
              out.write(f"ARTIFACT_URI={pointer['artifact_uri']}\n")
          PY

          source "$SOURCE_META"
          echo "artifact_fingerprint=$ARTIFACT_FINGERPRINT" >> "$GITHUB_OUTPUT"
          echo "artifact_uri=$ARTIFACT_URI" >> "$GITHUB_OUTPUT"

          LOCAL=".benchmark/source/${{ inputs.benchmark_id }}"
          HF_TOKEN="$BUCKET_TOKEN" hf buckets sync \
            "$ARTIFACT_URI" \
            "$LOCAL"

          python - "$LOCAL/manifest.json" "$ARTIFACT_FINGERPRINT" <<'PY'
          import json
          import sys
          from pathlib import Path

          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = sys.argv[2]
          if manifest.get("artifact_fingerprint") != expected:
              raise SystemExit("restored source manifest fingerprint mismatch")
          if not manifest.get("persistence", {}).get("persisted"):
              raise SystemExit("restored source manifest is not marked persisted")
          PY

      - name: Parse with application loaders and preprocessing
        id: parse
        continue-on-error: true
        env:
          PYTHONPATH: .
        run: |
          python scripts/parse_benchmark_source.py \
            --source-root ".benchmark/source/${{ inputs.benchmark_id }}" \
            --output-root .benchmark/parsed \
            --benchmark-id "${{ inputs.benchmark_id }}" \
            --workers "${{ inputs.workers }}" \
            --max-failures "${{ inputs.max_failures }}" \
            --pypdf-xform-limit "${{ inputs.pypdf_xform_limit }}" \
            --parent-source-fingerprint "${{ steps.source.outputs.artifact_fingerprint }}"

      - name: Read parsed artifact metadata
        if: steps.parse.outcome == 'success' || steps.parse.outcome == 'failure'
        id: parsed-meta
        shell: bash
        run: |
          MANIFEST=".benchmark/parsed/${{ inputs.benchmark_id }}/manifest.json"
          if [[ ! -f "$MANIFEST" ]]; then
            echo "::error::Parse manifest was not created."
            exit 1
          fi
          python - "$MANIFEST" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          from pathlib import Path

          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          with Path(sys.argv[2]).open("a", encoding="utf-8") as out:
              out.write(f"artifact_fingerprint={manifest['artifact_fingerprint']}\n")
              out.write(f"parsed_bytes={manifest['parsed_bytes']}\n")
              out.write(f"failures={manifest['total_failures']}\n")
          PY

      - name: Persist parsed artifact to private Hugging Face bucket
        if: steps.parse.outcome == 'success'
        id: persist
        shell: bash
        env:
          HF_OIDC_RESOURCE: buckets/abulhawa/document-qa-artifacts
        run: |
          BUCKET_TOKEN="$(hf auth token)"
          if [[ -z "$BUCKET_TOKEN" ]]; then
            echo "::error::Hugging Face bucket OIDC exchange returned an empty token."
            exit 1
          fi
          echo "::add-mask::$BUCKET_TOKEN"

          LOCAL=".benchmark/parsed/${{ inputs.benchmark_id }}"
          FINGERPRINT="${{ steps.parsed-meta.outputs.artifact_fingerprint }}"
          REMOTE="hf://buckets/abulhawa/document-qa-artifacts/${{ inputs.benchmark_id }}/parsed/${FINGERPRINT}"
          REMOTE_MANIFEST="$RUNNER_TEMP/remote-manifest.json"

          if HF_TOKEN="$BUCKET_TOKEN" hf buckets cp "${REMOTE}/manifest.json" "$REMOTE_MANIFEST" >/dev/null 2>&1; then
            python - "$REMOTE_MANIFEST" "$FINGERPRINT" <<'PY'
          import json
          import sys
          from pathlib import Path

          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = sys.argv[2]
          actual = manifest.get("artifact_fingerprint")
          if actual != expected:
              raise SystemExit(
                  f"remote artifact fingerprint mismatch: expected {expected}, got {actual}"
              )
          PY
            cp "$REMOTE_MANIFEST" "$LOCAL/manifest.json"
            REUSED=true
          else
            HF_TOKEN="$BUCKET_TOKEN" hf buckets sync "$LOCAL" "$REMOTE" --exclude "manifest.json"

            python - "$LOCAL/manifest.json" "$REMOTE" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          manifest = json.loads(path.read_text(encoding="utf-8"))
          manifest["persistence"].update(
              {
                  "persisted": True,
                  "artifact_uri": sys.argv[2],
                  "reused_existing": False,
              }
          )
          path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
            HF_TOKEN="$BUCKET_TOKEN" hf buckets cp "$LOCAL/manifest.json" "${REMOTE}/manifest.json"
            HF_TOKEN="$BUCKET_TOKEN" hf buckets cp "${REMOTE}/manifest.json" "$REMOTE_MANIFEST"
            cmp "$LOCAL/manifest.json" "$REMOTE_MANIFEST"
            REUSED=false
          fi

          echo "artifact_uri=$REMOTE" >> "$GITHUB_OUTPUT"
          echo "reused_existing=$REUSED" >> "$GITHUB_OUTPUT"

      - name: Finalize manifest metadata
        if: steps.parse.outcome == 'success' || steps.parse.outcome == 'failure'
        id: final-meta
        shell: bash
        run: |
          MANIFEST=".benchmark/parsed/${{ inputs.benchmark_id }}/manifest.json"
          if [[ ! -f "$MANIFEST" ]]; then
            exit 1
          fi
          MANIFEST_SHA="$(sha256sum "$MANIFEST" | awk '{print $1}')"
          echo "manifest_sha=$MANIFEST_SHA" >> "$GITHUB_OUTPUT"

      - name: Upload parse manifest and errors
        if: steps.parse.outcome == 'success' || steps.parse.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.benchmark_id }}-parse-manifest-${{ steps.final-meta.outputs.manifest_sha }}
          path: |
            .benchmark/parsed/${{ inputs.benchmark_id }}/manifest.json
            .benchmark/parsed/${{ inputs.benchmark_id }}/errors.jsonl
          if-no-files-found: error
          retention-days: 30

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Benchmark parse"
            echo
            echo "- Benchmark: \`${{ inputs.benchmark_id }}\`"
            echo "- Source artifact: \`${{ steps.source.outputs.artifact_fingerprint }}\`"
            echo "- Parsed artifact: \`${{ steps.parsed-meta.outputs.artifact_fingerprint }}\`"
            echo "- Parsed bytes: \`${{ steps.parsed-meta.outputs.parsed_bytes }}\`"
            echo "- Parse failures: \`${{ steps.parsed-meta.outputs.failures }}\`"
            echo "- Artifact URI: \`${{ steps.persist.outputs.artifact_uri }}\`"
            echo "- Reused existing parsed artifact: \`${{ steps.persist.outputs.reused_existing }}\`"
            echo "- Authentication: short-lived Hugging Face OIDC tokens."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if parser failed
        if: steps.parse.outcome != 'success'
        run: exit 1
