name: Benchmark 2 - Parse

on:
  workflow_dispatch:
    inputs:
      benchmark_id:
        description: Frozen benchmark identifier
        required: true
        default: composite-v1
        type: string
      composition_file:
        description: Benchmark composition specification
        required: true
        default: evaluation/benchmarks/composite_v1.yaml
        type: string
      lock_file:
        description: Frozen source lock
        required: true
        default: evaluation/benchmarks/composite_v1.lock.json.gz
        type: string
      workers:
        description: Parallel parser workers
        required: true
        default: "4"
        type: string
      max_failures:
        description: Allowed parse failures before failing the workflow
        required: true
        default: "0"
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: benchmark-parse-${{ inputs.benchmark_id }}
  cancel-in-progress: false

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install source + parse dependencies
        run: python -m pip install -r requirements/parse.txt

      - name: Mint short-lived Hugging Face read token
        shell: bash
        env:
          HF_OIDC_RESOURCE: abulhawa
        run: |
          TOKEN="$(hf auth token)"
          if [[ -z "$TOKEN" ]]; then
            echo "::error::Hugging Face account OIDC exchange returned an empty token."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "HF_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Restore public source download cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .benchmark/cache/source/open_ragbench
            .benchmark/cache/source/nfcorpus
          key: benchmark-public-source-${{ runner.os }}-${{ hashFiles(inputs.composition_file) }}
          restore-keys: |
            benchmark-public-source-${{ runner.os }}-

      - name: Reconstruct frozen source corpus
        env:
          PYTHONPATH: .
        run: |
          python scripts/build_benchmark_source.py \
            --spec "${{ inputs.composition_file }}" \
            --lock "${{ inputs.lock_file }}" \
            --output-root .benchmark/source \
            --cache-dir .benchmark/cache/source

      - name: Parse with application loaders and preprocessing
        id: parse
        continue-on-error: true
        env:
          PYTHONPATH: .
        run: |
          python scripts/parse_benchmark_source.py \
            --source-root ".benchmark/source/${{ inputs.benchmark_id }}" \
            --output-root .benchmark/parsed \
            --benchmark-id "${{ inputs.benchmark_id }}" \
            --workers "${{ inputs.workers }}" \
            --max-failures "${{ inputs.max_failures }}"

      - name: Read parsed artifact metadata
        if: always()
        id: parsed-meta
        shell: bash
        run: |
          MANIFEST=".benchmark/parsed/${{ inputs.benchmark_id }}/manifest.json"
          if [[ ! -f "$MANIFEST" ]]; then
            echo "::error::Parse manifest was not created."
            exit 1
          fi
          python - "$MANIFEST" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          from pathlib import Path

          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          with Path(sys.argv[2]).open("a", encoding="utf-8") as out:
              out.write(f"artifact_fingerprint={manifest['artifact_fingerprint']}\n")
              out.write(f"parsed_bytes={manifest['parsed_bytes']}\n")
              out.write(f"failures={manifest['total_failures']}\n")
          PY

      - name: Persist parsed artifact to private Hugging Face bucket
        if: steps.parse.outcome == 'success'
        id: persist
        shell: bash
        env:
          HF_OIDC_RESOURCE: buckets/abulhawa/document-qa-artifacts
        run: |
          unset HF_TOKEN
          BUCKET_TOKEN="$(hf auth token)"
          if [[ -z "$BUCKET_TOKEN" ]]; then
            echo "::error::Hugging Face bucket OIDC exchange returned an empty token."
            exit 1
          fi
          echo "::add-mask::$BUCKET_TOKEN"

          LOCAL=".benchmark/parsed/${{ inputs.benchmark_id }}"
          FINGERPRINT="${{ steps.parsed-meta.outputs.artifact_fingerprint }}"
          REMOTE="hf://buckets/abulhawa/document-qa-artifacts/${{ inputs.benchmark_id }}/parsed/${FINGERPRINT}"
          REMOTE_MANIFEST="$RUNNER_TEMP/remote-manifest.json"

          if HF_TOKEN="$BUCKET_TOKEN" hf buckets cp "${REMOTE}/manifest.json" "$REMOTE_MANIFEST" >/dev/null 2>&1; then
            python - "$REMOTE_MANIFEST" "$FINGERPRINT" <<'PY'
          import json
          import sys
          from pathlib import Path

          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = sys.argv[2]
          actual = manifest.get("artifact_fingerprint")
          if actual != expected:
              raise SystemExit(
                  f"remote artifact fingerprint mismatch: expected {expected}, got {actual}"
              )
          PY
            REUSED=true
          else
            HF_TOKEN="$BUCKET_TOKEN" hf buckets sync "$LOCAL" "$REMOTE" --exclude "manifest.json"

            python - "$LOCAL/manifest.json" "$REMOTE" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          manifest = json.loads(path.read_text(encoding="utf-8"))
          manifest["persistence"].update(
              {
                  "persisted": True,
                  "artifact_uri": sys.argv[2],
                  "reused_existing": False,
              }
          )
          path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
            HF_TOKEN="$BUCKET_TOKEN" hf buckets cp "$LOCAL/manifest.json" "${REMOTE}/manifest.json"
            HF_TOKEN="$BUCKET_TOKEN" hf buckets cp "${REMOTE}/manifest.json" "$REMOTE_MANIFEST"
            cmp "$LOCAL/manifest.json" "$REMOTE_MANIFEST"
            REUSED=false
          fi

          if [[ "$REUSED" == "true" ]]; then
            python - "$LOCAL/manifest.json" "$REMOTE" "$REMOTE_MANIFEST" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          remote_manifest = Path(sys.argv[3])
          manifest = json.loads(path.read_text(encoding="utf-8"))
          manifest["persistence"].update(
              {
                  "persisted": True,
                  "artifact_uri": sys.argv[2],
                  "reused_existing": True,
                  "remote_manifest_sha256": hashlib.sha256(
                      remote_manifest.read_bytes()
                  ).hexdigest(),
              }
          )
          path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          fi

          echo "artifact_uri=$REMOTE" >> "$GITHUB_OUTPUT"
          echo "reused_existing=$REUSED" >> "$GITHUB_OUTPUT"

      - name: Finalize manifest metadata
        if: always()
        id: final-meta
        shell: bash
        run: |
          MANIFEST=".benchmark/parsed/${{ inputs.benchmark_id }}/manifest.json"
          if [[ ! -f "$MANIFEST" ]]; then
            exit 1
          fi
          MANIFEST_SHA="$(sha256sum "$MANIFEST" | awk '{print $1}')"
          echo "manifest_sha=$MANIFEST_SHA" >> "$GITHUB_OUTPUT"

      - name: Upload parse manifest and errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.benchmark_id }}-parse-manifest-${{ steps.final-meta.outputs.manifest_sha }}
          path: |
            .benchmark/parsed/${{ inputs.benchmark_id }}/manifest.json
            .benchmark/parsed/${{ inputs.benchmark_id }}/errors.jsonl
          if-no-files-found: error
          retention-days: 30

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Benchmark parse"
            echo
            echo "- Benchmark: \`${{ inputs.benchmark_id }}\`"
            echo "- Artifact fingerprint: \`${{ steps.parsed-meta.outputs.artifact_fingerprint }}\`"
            echo "- Parsed bytes: \`${{ steps.parsed-meta.outputs.parsed_bytes }}\`"
            echo "- Parse failures: \`${{ steps.parsed-meta.outputs.failures }}\`"
            echo "- Manifest SHA256: \`${{ steps.final-meta.outputs.manifest_sha }}\`"
            echo "- Artifact URI: \`${{ steps.persist.outputs.artifact_uri }}\`"
            echo "- Reused existing artifact: \`${{ steps.persist.outputs.reused_existing }}\`"
            echo "- Authentication: short-lived Hugging Face OIDC tokens; no long-lived HF secret."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if parser failed
        if: steps.parse.outcome != 'success'
        run: exit 1
