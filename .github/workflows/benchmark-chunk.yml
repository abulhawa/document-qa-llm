name: Benchmark 3 - Chunk

on:
  workflow_dispatch:
    inputs:
      benchmark_id:
        description: Frozen benchmark identifier
        required: true
        default: composite-v1
        type: string
      parsed_artifact_fingerprint:
        description: Exact persisted Benchmark 2 parsed artifact fingerprint
        required: true
        default: 944beca7cab772d18261b6ebbb0b7b8a80180bd0a02b25c01daf14e79ed757bd
        type: string
      chunk_size:
        description: Production chunk size in characters
        required: true
        default: "800"
        type: string
      chunk_overlap:
        description: Production chunk overlap in characters
        required: true
        default: "100"
        type: string
      max_failures:
        description: Allowed document chunking failures
        required: true
        default: "0"
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: benchmark-chunk-${{ inputs.benchmark_id }}
  cancel-in-progress: false

jobs:
  chunk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install chunk dependencies
        run: python -m pip install -r requirements/chunk.txt

      - name: Restore exact parsed artifact from private Hugging Face bucket
        id: parent
        shell: bash
        env:
          HF_OIDC_RESOURCE: buckets/abulhawa/document-qa-artifacts
        run: |
          BUCKET_TOKEN="$(hf auth token)"
          if [[ -z "$BUCKET_TOKEN" ]]; then
            echo "::error::Hugging Face bucket OIDC exchange returned an empty token."
            exit 1
          fi
          echo "::add-mask::$BUCKET_TOKEN"

          FINGERPRINT="${{ inputs.parsed_artifact_fingerprint }}"
          REMOTE="hf://buckets/abulhawa/document-qa-artifacts/${{ inputs.benchmark_id }}/parsed/$FINGERPRINT"
          LOCAL=".benchmark/parsed/${{ inputs.benchmark_id }}"

          HF_TOKEN="$BUCKET_TOKEN" hf buckets sync "$REMOTE" "$LOCAL"

          python - "$LOCAL/manifest.json" "$FINGERPRINT" "${{ inputs.benchmark_id }}" "$REMOTE" <<'PY'
          import json
          import sys
          from pathlib import Path

          manifest_path = Path(sys.argv[1])
          expected_fingerprint = sys.argv[2]
          expected_benchmark = sys.argv[3]
          expected_uri = sys.argv[4]
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          if manifest.get("artifact_fingerprint") != expected_fingerprint:
              raise SystemExit("restored parsed manifest fingerprint mismatch")
          if manifest.get("artifact_type") != "parsed":
              raise SystemExit("restored parent is not a parsed artifact")
          if manifest.get("benchmark_id") != expected_benchmark:
              raise SystemExit("restored parsed benchmark_id mismatch")
          persistence = manifest.get("persistence", {})
          if not persistence.get("persisted"):
              raise SystemExit("restored parsed artifact is not marked persisted")
          if persistence.get("artifact_uri") != expected_uri:
              raise SystemExit("restored parsed artifact URI mismatch")
          PY

          echo "artifact_fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"
          echo "artifact_uri=$REMOTE" >> "$GITHUB_OUTPUT"

      - name: Chunk with production splitter
        id: chunk
        continue-on-error: true
        env:
          PYTHONPATH: .
        run: |
          python scripts/chunk_benchmark_parsed.py \
            --parsed-root ".benchmark/parsed/${{ inputs.benchmark_id }}" \
            --output-root .benchmark/chunks \
            --benchmark-id "${{ inputs.benchmark_id }}" \
            --parent-parsed-fingerprint "${{ steps.parent.outputs.artifact_fingerprint }}" \
            --chunk-size "${{ inputs.chunk_size }}" \
            --chunk-overlap "${{ inputs.chunk_overlap }}" \
            --max-failures "${{ inputs.max_failures }}"

      - name: Read chunk artifact metadata
        if: steps.chunk.outcome == 'success' || steps.chunk.outcome == 'failure'
        id: chunk-meta
        shell: bash
        run: |
          MANIFEST=".benchmark/chunks/${{ inputs.benchmark_id }}/manifest.json"
          if [[ ! -f "$MANIFEST" ]]; then
            echo "::error::Chunk manifest was not created."
            exit 1
          fi
          python - "$MANIFEST" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          from pathlib import Path

          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          quality = manifest.get("quality", {})
          with Path(sys.argv[2]).open("a", encoding="utf-8") as out:
              out.write(f"artifact_fingerprint={manifest['artifact_fingerprint']}\n")
              out.write(f"chunk_bytes={manifest['chunk_bytes']}\n")
              out.write(f"failures={manifest['total_failures']}\n")
              out.write(f"total_chunks={quality.get('total_chunks', 0)}\n")
              out.write(f"empty_input_pages={quality.get('empty_input_pages', 0)}\n")
              out.write(f"documents_with_zero_chunks={quality.get('documents_with_zero_chunks', 0)}\n")
              out.write(f"zero_length_chunks={quality.get('zero_length_chunks', 0)}\n")
          PY

      - name: Persist chunk artifact to private Hugging Face bucket
        if: steps.chunk.outcome == 'success'
        id: persist
        shell: bash
        env:
          HF_OIDC_RESOURCE: buckets/abulhawa/document-qa-artifacts
        run: |
          BUCKET_TOKEN="$(hf auth token)"
          if [[ -z "$BUCKET_TOKEN" ]]; then
            echo "::error::Hugging Face bucket OIDC exchange returned an empty token."
            exit 1
          fi
          echo "::add-mask::$BUCKET_TOKEN"

          LOCAL=".benchmark/chunks/${{ inputs.benchmark_id }}"
          FINGERPRINT="${{ steps.chunk-meta.outputs.artifact_fingerprint }}"
          REMOTE="hf://buckets/abulhawa/document-qa-artifacts/${{ inputs.benchmark_id }}/chunks/$FINGERPRINT"
          REMOTE_MANIFEST="$RUNNER_TEMP/remote-chunk-manifest.json"

          if HF_TOKEN="$BUCKET_TOKEN" hf buckets cp "${REMOTE}/manifest.json" "$REMOTE_MANIFEST" >/dev/null 2>&1; then
            python - "$REMOTE_MANIFEST" "$FINGERPRINT" "${{ steps.parent.outputs.artifact_fingerprint }}" <<'PY'
          import json
          import sys
          from pathlib import Path

          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if manifest.get("artifact_fingerprint") != sys.argv[2]:
              raise SystemExit("remote chunk artifact fingerprint mismatch")
          if manifest.get("parent_parsed_artifact_fingerprint") != sys.argv[3]:
              raise SystemExit("remote chunk parent fingerprint mismatch")
          PY
            cp "$REMOTE_MANIFEST" "$LOCAL/manifest.json"
            REUSED=true
          else
            HF_TOKEN="$BUCKET_TOKEN" hf buckets sync "$LOCAL" "$REMOTE" --exclude "manifest.json"

            python - "$LOCAL/manifest.json" "$REMOTE" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          manifest = json.loads(path.read_text(encoding="utf-8"))
          manifest["persistence"].update(
              {
                  "persisted": True,
                  "artifact_uri": sys.argv[2],
                  "reused_existing": False,
              }
          )
          path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
            HF_TOKEN="$BUCKET_TOKEN" hf buckets cp "$LOCAL/manifest.json" "${REMOTE}/manifest.json"
            HF_TOKEN="$BUCKET_TOKEN" hf buckets cp "${REMOTE}/manifest.json" "$REMOTE_MANIFEST"
            cmp "$LOCAL/manifest.json" "$REMOTE_MANIFEST"
            REUSED=false
          fi

          POINTER="$RUNNER_TEMP/chunks-current.json"
          python - "$LOCAL/manifest.json" "$POINTER" <<'PY'
          import json
          import sys
          from pathlib import Path

          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          pointer = {
              "schema_version": 1,
              "benchmark_id": manifest["benchmark_id"],
              "artifact_type": "chunks",
              "artifact_fingerprint": manifest["artifact_fingerprint"],
              "artifact_uri": manifest["persistence"]["artifact_uri"],
              "parent_parsed_artifact_fingerprint": manifest["parent_parsed_artifact_fingerprint"],
              "chunker_config": manifest["chunker_config"],
          }
          Path(sys.argv[2]).write_text(
              json.dumps(pointer, indent=2, ensure_ascii=False, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          HF_TOKEN="$BUCKET_TOKEN" hf buckets cp "$POINTER"             "hf://buckets/abulhawa/document-qa-artifacts/${{ inputs.benchmark_id }}/chunks/current.json"

          echo "artifact_uri=$REMOTE" >> "$GITHUB_OUTPUT"
          echo "reused_existing=$REUSED" >> "$GITHUB_OUTPUT"

      - name: Finalize manifest metadata
        if: steps.chunk.outcome == 'success' || steps.chunk.outcome == 'failure'
        id: final-meta
        shell: bash
        run: |
          MANIFEST=".benchmark/chunks/${{ inputs.benchmark_id }}/manifest.json"
          [[ -f "$MANIFEST" ]] || exit 1
          echo "manifest_sha=$(sha256sum "$MANIFEST" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Upload chunk manifest and errors
        if: steps.chunk.outcome == 'success' || steps.chunk.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.benchmark_id }}-chunk-manifest-${{ steps.final-meta.outputs.manifest_sha }}
          path: |
            .benchmark/chunks/${{ inputs.benchmark_id }}/manifest.json
            .benchmark/chunks/${{ inputs.benchmark_id }}/errors.jsonl
          if-no-files-found: error
          retention-days: 30

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Benchmark chunking"
            echo
            echo "- Benchmark: \`${{ inputs.benchmark_id }}\`"
            echo "- Parent parsed artifact: \`${{ steps.parent.outputs.artifact_fingerprint }}\`"
            echo "- Chunk artifact: \`${{ steps.chunk-meta.outputs.artifact_fingerprint }}\`"
            echo "- Chunk config: \`${{ inputs.chunk_size }}/${{ inputs.chunk_overlap }}\`"
            echo "- Total chunks: \`${{ steps.chunk-meta.outputs.total_chunks }}\`"
            echo "- Chunk bytes: \`${{ steps.chunk-meta.outputs.chunk_bytes }}\`"
            echo "- Failures: \`${{ steps.chunk-meta.outputs.failures }}\`"
            echo "- Empty input pages: \`${{ steps.chunk-meta.outputs.empty_input_pages }}\`"
            echo "- Documents with zero chunks: \`${{ steps.chunk-meta.outputs.documents_with_zero_chunks }}\`"
            echo "- Zero-length chunks: \`${{ steps.chunk-meta.outputs.zero_length_chunks }}\`"
            echo "- Artifact URI: \`${{ steps.persist.outputs.artifact_uri }}\`"
            echo "- Reused existing chunk artifact: \`${{ steps.persist.outputs.reused_existing }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if chunking failed
        if: steps.chunk.outcome != 'success'
        run: exit 1
