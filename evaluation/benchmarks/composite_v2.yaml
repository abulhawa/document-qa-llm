# Expanded corpus with the same frozen query sets as composite-v1.
schema_version: 1
benchmark_id: composite-v2
status: source-acquisition-ready
requires_frozen_lock: true
selection_seed: 20260928
selection_algorithm: stable-sha256-v1

principles:
  - deterministic_selection
  - preserve_source_provenance
  - per_source_metrics
  - no_runtime_resampling
  - private_corpus_artifacts_by_default
  - source_native_runs_separate_from_composite_scores

tiers:
  smoke:
    total_queries: 40
    queries:
      open_ragbench: 10
      officeqa: 10
      nfcorpus: 10
      miracl_de: 5
      miracl_ar: 5
  medium:
    total_queries: 120
    queries:
      open_ragbench: 40
      officeqa: 20
      nfcorpus: 30
      miracl_de: 15
      miracl_ar: 15
  full:
    total_queries: 410
    queries:
      open_ragbench: 160
      officeqa: 50
      nfcorpus: 100
      miracl_de: 50
      miracl_ar: 50

sources:
  open_ragbench:
    upstream: vectara/open_ragbench
    upstream_revision: LOCKED_AT_SOURCE_BUILD
    license: CC-BY-NC-4.0
    source_format: pdf
    selection:
      positive_documents: 80
      distractor_documents: 920
      questions: 160
      modality: text_only
      questions_per_positive_target: 2
      eligibility:
        query_source: text
        min_eligible_queries_per_positive_document: 2
      query_selection:
        prefer_one_extractive_and_one_abstractive_per_document: true
        fallback: stable_hash
      distractor_pool: documents_not_gold_for_selected_queries
    notes:
      - Use only upstream labels and stable hashing; never use Document QA scores.
      - Record observed arXiv category distribution after selection rather than optimizing against retrieval performance.
      - The 80 positive PDFs and 160 questions are identical to composite-v1.
      - All 1,000 upstream arXiv PDFs are included; 920 are distractors for the selected questions.
      - Distractors were not selected by semantic or lexical similarity.
      - Documents relevant only to unselected questions are valid distractors here.
      - Exact document/query IDs are frozen in the source lock.

  officeqa:
    upstream: databricks/officeqa
    upstream_revision: LOCKED_AT_SOURCE_BUILD
    license: CC-BY-SA-4.0
    access: gated_huggingface
    source_format: pdf
    selection:
      dataset: officeqa_full
      questions: 50
      easy_questions: 25
      hard_questions: 25
      include_all_referenced_source_documents: true
      distractor_documents_target_total_pdfs: 150
      question_selection:
        difficulty_quotas:
          easy: 25
          hard: 25
        balance_within_difficulty_by: source_document_decade
        ordering: stable_hash
      distractor_selection:
        prefer_same_decades_as_selected_sources: true
        fallback: stable_hash_from_remaining_corpus
    notes:
      - Requires HF_TOKEN when source acquisition is implemented.
      - Pro V2 is intentionally deferred from composite-v1.

  nfcorpus:
    upstream: BEIR/nfcorpus
    url: https://public.ukp.informatik.tu-darmstadt.de/thakur/BEIR/datasets/nfcorpus.zip
    source_integrity: sha256_locked_at_source_build
    source_format: text
    selection:
      corpus: full
      corpus_documents_approx: 3600
      test_queries: 100
      query_ordering: stable_hash
    notes:
      - Full corpus is retained because it is small.
      - Query IDs are fixed in the generated source manifest.
      - Acquisition reads the official BEIR ZIP directly; Hugging Face datasets is not required.

  miracl_de:
    upstream: mteb/MIRACLRetrieval_de_top_250_only_w_correct-v2
    upstream_revision: LOCKED_AT_SOURCE_BUILD
    license: CC-BY-SA-4.0
    source_format: text
    language: de
    selection:
      queries: 50
      split: test
      hard_negatives_per_query_max: 20
      include_all_positives: true
      query_ordering: stable_hash
      negative_ordering: stable_hash
    notes:
      - Acquisition reads the repository Parquet shards directly with PyArrow.

  miracl_ar:
    upstream: mteb/MIRACLRetrieval_ar_top_250_only_w_correct-v2
    upstream_revision: LOCKED_AT_SOURCE_BUILD
    license: CC-BY-SA-4.0
    source_format: text
    language: ar
    selection:
      queries: 50
      split: test
      hard_negatives_per_query_max: 20
      include_all_positives: true
      query_ordering: stable_hash
      negative_ordering: stable_hash
    notes:
      - Acquisition reads the repository Parquet shards directly with PyArrow.

reporting:
  primary_metrics:
    - recall_at_1
    - recall_at_3
    - recall_at_5
    - mrr
    - ndcg_at_5
    - latency
  per_track_required: true
  composite:
    enabled: true
    aggregation: macro_average_across_tracks
    tracks:
      - open_ragbench
      - officeqa
      - nfcorpus
      - miracl_de
      - miracl_ar

storage:
  corpus_artifacts_visibility: private
  durable_store_candidate: ghcr_oci
  actions_cache_role: acceleration_only
  native_index_snapshots:
    opensearch: 3.8.0
    qdrant: 1.19.1

unresolved_before_activation:
  - Keep composite-v1 artifacts immutable.
  - Use cache-aware stage builders before starting v2 parse, chunk, and embedding jobs.
  - Measure runner disk headroom for the larger source and index artifacts.

